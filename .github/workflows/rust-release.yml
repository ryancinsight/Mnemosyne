name: Crates.io Release

on:
  release:
    types: [published]
  push:
    branches: [main]
  schedule:
    - cron: "10 6 * * *"
  workflow_dispatch:
    inputs:
      package:
        description: Workspace package to validate without publishing
        required: true
        type: string
      version:
        description: Exact Cargo package version
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: crates-release-${{ github.event.release.tag_name || inputs.package || github.event_name }}
  cancel-in-progress: false

jobs:
  # The shared Atlas SemVer gate in release mode: blocking against the latest
  # published version of every package (ATLAS-SEMVER-GATE-RELEASE-JOB-
  # UNREACHABLE: a gate called only from the branch-triggered CI workflow
  # never sees a release event). A public break the manifest version does not
  # cover stops the release here.
  semver:
    name: SemVer gate (release)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'crate-')
    uses: ryancinsight/atlas/.github/workflows/semver-gate.yml@ee2b7200c4781e39b5ea3e379d2aa97947758099
    with:
      release-gate: true
      package: mnemosyne,mnemosyne-memory-core,mnemosyne-memory,mnemosyne-arena,mnemosyne-backend,mnemosyne-local,mnemosyne-heap,mnemosyne-decay,mnemosyne-hardened,mnemosyne-prof,mnemosyne-c-shim
      rust-toolchain: 1.97.0
    permissions:
      contents: read

  publish:
    needs: semver
    # Gate stays here: the shared validate job has no prefix check and fails
    # closed, so a legacy tag would go from a silent skip to a red run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'crate-')
    # Body owned once by Atlas (ADR 0035), pinned by SHA like any action.
    uses: ryancinsight/atlas/.github/workflows/crates-publish.yml@4c31dd753f06dd93b4c04798cf781df253e3e532
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing; no stored registry token.
    with:
      rust-toolchain: "1.97.0"
      dispatch-package: ${{ inputs.package }}
      dispatch-version: ${{ inputs.version }}

  # Version-change publishing (ADR 0068): a merged version bump publishes and
  # tags the pending set; the daily run retries a set that waited on a
  # dependency published from another repository.
  publish-pending:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    uses: ryancinsight/atlas/.github/workflows/crates-publish-pending.yml@ee2b7200c4781e39b5ea3e379d2aa97947758099
    permissions:
      contents: write # creates the release tags
      id-token: write # OIDC trusted publishing; no stored registry token.
    with:
      rust-toolchain: "1.97.0"
