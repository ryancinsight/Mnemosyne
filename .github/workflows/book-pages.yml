name: Deploy mdBook

on:
  push:
    branches: [main]
    paths:
      - "docs/book/**"
      - ".github/workflows/book-pages.yml"
  pull_request:
    paths:
      - "docs/book/**"
      - ".github/workflows/book-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # Body owned once by Atlas (ADR 0035); the caller passes only the
    # built output directory. Enable Pages once per repository under
    # Settings -> Pages -> Source: GitHub Actions.
    uses: ryancinsight/atlas/.github/workflows/book-pages.yml@d875348197be12ad593f993a6f1b8a62d3b8b195
    permissions:
      contents: read
      pages: write
      id-token: write # OIDC Pages artifact flow; no deploy key.
    with:
      output-path: target/book/mnemosyne
