name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.97.0

jobs:
  verify:
    name: Rust verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: nextest@0.9.140

      - name: Check formatting
        run: cargo fmt --all -- --check

      # mnemosyne-benchmarks is excluded throughout: it pulls snmalloc-rs,
      # whose build fails under current host compilers (atlas
      # backlog.md#atlas-mnemosyne-snmalloc-1). Everything else is covered.
      #
      # Three lints are allowed, each with a removal trigger; every other
      # lint, including all correctness lints, gates the whole workspace.
      #
      # missing_const_for_thread_local: clippy 1.97.0 fires it on initializers
      # that are ALREADY `const { .. }` -- see
      # crates/mnemosyne-arena/src/segment/pool/segment_pool.rs:67. Drop when
      # the pinned toolchain moves past the false positive.
      #
      # needless_return, collapsible_if: pre-existing debt in the cfg(unix)
      # madvise paths (backends/unix.rs:99, :200, :260), which only compile on
      # Unix. They sit inside mutually exclusive cfg blocks with macOS and
      # FreeBSD arms, so a fix needs verification on platforms this project
      # has no runner for. Tracked separately; drop when those sites are
      # cleaned. Reproduce locally without a Linux box:
      #   cargo clippy --target x86_64-unknown-linux-gnu -p mnemosyne-backend
      - name: Lint all affected targets
        run: >-
          cargo clippy --locked --workspace --exclude mnemosyne-benchmarks
          --all-targets --
          -D warnings
          -A clippy::missing_const_for_thread_local
          -A clippy::needless_return
          -A clippy::collapsible_if

      - name: Run native tests
        run: cargo nextest run --locked --workspace --exclude mnemosyne-benchmarks

      - name: Run documentation tests
        run: cargo test --locked --workspace --exclude mnemosyne-benchmarks --doc
