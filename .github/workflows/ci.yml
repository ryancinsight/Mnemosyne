name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.97.0

jobs:
  # Guards the one artifact whose correctness cannot be checked from inside the
  # overlay environment that produces it. Calls the shared Atlas workflow.
  lockfile:
    name: Lockfile integrity
    uses: ryancinsight/atlas/.github/workflows/lockfile-guard.yml@886d85b0e4bea20c8e5ec4b4239e6ba9cdbcf74d
    permissions:
      contents: read

  # Public-surface compatibility gate for the publishable crates
  # (MN-460 / atlas ATLAS-SEMVER-GATE-FLEETWIDE-2026-08-28). Informational on
  # PRs; blocking on release tags when the manifest version does not cover
  # the detected class.
  semver:
    name: SemVer gate
    uses: ryancinsight/atlas/.github/workflows/semver-gate.yml@9062cfc6d78808cf1b7af60ae97f11825a6c8468
    with:
      package: mnemosyne,mnemosyne-memory-core,mnemosyne-memory,mnemosyne-arena,mnemosyne-backend,mnemosyne-local,mnemosyne-heap,mnemosyne-decay,mnemosyne-hardened,mnemosyne-prof,mnemosyne-c-shim
      rust-toolchain: 1.97.0
    permissions:
      contents: read

  verify:
    name: Rust verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: nextest@0.9.140

      - name: Check formatting
        run: cargo fmt --all -- --check

      # No lint allows remain. The three former command-line allows were
      # retired 2026-08-05 (ATLAS-MNEMOSYNE-CI-1): the workspace passes bare
      # `-D warnings` under the pinned 1.97.0 toolchain with
      # `--target x86_64-unknown-linux-gnu` (the runner's cfg(unix) code is
      # otherwise stripped on Windows hosts). needless_return/collapsible_if
      # no longer fire anywhere -- the cfg(unix) madvise sites were cleaned --
      # and the single missing_const_for_thread_local false positive is
      # already suppressed at its site with its own removal trigger
      # (crates/mnemosyne-arena/src/segment/pool/segment_pool.rs).
      #
      # mnemosyne-benchmarks participates everywhere now: the SnMalloc
      # comparator that could not build on hosted runners is opt-in via the
      # `snmalloc` feature (default builds omit it), so the crate compiles
      # clean under default features. The dedicated `benchmark-hygiene` job
      # below lints and smoke-runs it.
      - name: Lint all affected targets
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # `c_char` is signed on x86_64-linux and unsigned on aarch64-linux, so a
      # cast that is load-bearing on one target is a lint error on the other.
      # The aarch64 job runs native tests, not a lint, so nothing else covers
      # it (MN-465). The check is scoped to the crate that declares the C
      # signatures: a cross-target clippy needs no cross toolchain because it
      # checks without linking, but a workspace-wide one would also build the
      # benchmark comparators' C allocators for the target, which need an
      # arm64 libc the hosted runner does not carry.
      - name: Lint for aarch64-linux
        run: |
          rustup target add aarch64-unknown-linux-gnu
          cargo clippy --locked -p mnemosyne-backend --all-targets --target aarch64-unknown-linux-gnu -- -D warnings


      # mnemosyne-c-shim is back in scope. Its test binary used to exit
      # without producing a test list on Linux: the shim defines malloc,
      # free and friends as no_mangle, which on ELF interposes libc
      # process-wide, so the harness's own startup allocations routed
      # through the shim before it was ready. Those seven symbols are now
      # exported only outside cfg(test), so the harness links a normal libc.
      - name: Run native tests
        run: cargo nextest run --locked --workspace

      - name: Run documentation tests
        run: cargo test --locked --workspace --doc

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cargo-deny and cargo-machete
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: cargo-deny,cargo-machete
      - name: cargo deny check (advisories bans licenses sources)
        run: cargo deny check advisories bans licenses sources
      - name: cargo machete (unused dependencies)
        run: cargo machete

  # Loom enumerates thread interleavings rather than sampling them, which is
  # what the `*_concurrent_push_pop` stress tests do. It is the tool for the
  # happens-before edges Miri does not check: Miri validates aliasing and leaks
  # on the schedule it happens to run.
  #
  # `cfg(loom)` is set only here. It is deliberately not a cargo feature —
  # features are additive and could unify loom's instrumented atomics into an
  # ordinary build of the shipped allocator; a cfg cannot.
  loom:
    name: Loom (bounded-exhaustive interleavings)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      # Release profile: loom explores a large state space and a debug build
      # makes that needlessly slow. The models assert behaviour, not timing, so
      # the profile does not affect what they prove.
      - name: Loom models — free-list head protocol
        env:
          RUSTFLAGS: "--cfg loom"
        run: >-
          cargo test --locked -p mnemosyne-memory-core
          --test loom_atomic_free_list --release

      # The ownership pair, added under MN-433. Both edge models fail if the
      # publishing store is weakened to Relaxed, so they test the
      # Release/Acquire edge rather than merely exercising it.
      - name: Loom models — segment ownership protocol
        env:
          RUSTFLAGS: "--cfg loom"
        run: >-
          cargo test --locked -p mnemosyne-memory-core
          --test loom_segment_ownership --release

      # The pool stack's pop protocol. One model is `#[ignore]`d: it reproduces
      # the MN-455 data race between a popper clearing a node's link and another
      # popper still reading it, and stays runnable so the fix can be checked
      # against it.
      - name: Loom models — pool stack pop protocol
        env:
          RUSTFLAGS: "--cfg loom"
        run: >-
          cargo test --locked -p mnemosyne-arena
          --test loom_tagged_stack --release

  # Miri has repeatedly been the tool that found real defects here — the
  # 2026-07-13 page-metadata aliasing violation and the AlignedVec::into_vec
  # leak were both caught under it (gap_audit.md). Until now it ran only by
  # hand during those investigations, so nothing stopped that defect class from
  # returning. This job makes it standing.
  #
  # Scope is deliberately per-crate rather than workspace-wide. The allocator's
  # segment alignment and tagged-pointer structures reconstruct pointers from
  # exposed provenance, which Miri reports (gap_audit.md, 2026-07-13 closure),
  # so a blanket run would be red for a known and accepted reason. Crates are
  # added here only once they actually pass; the excluded ones are tracked
  # rather than silently absent.
  miri:
    name: Miri (aliasing and leak checking)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Miri nightly toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: nightly
          components: miri

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: nextest@0.9.140

      # Isolation is disabled because the allocator reads the clock and the OS
      # page size; leak checking stays on, since a leak is precisely what this
      # allocator must never do.
      #
      # The `*_concurrency` integration binaries are excluded. They are stress
      # tests sized for native execution — 8 threads x 50,000 iterations for the
      # huge pool, 4 x 20,000 for the segment pool — and Miri interprets every
      # instruction while preempting at every atomic, so the huge-pool one ran
      # past 600s while the smaller one merely crawled. That is workload size,
      # not a hang: the two differ by 5x in operations and behaved accordingly.
      # Raising the bound again would only buy a slower red. The exclusion is a
      # scope decision, not a suppression — Miri's value here is aliasing and
      # leak checking over the unit tests, whereas exhaustive interleaving
      # coverage is loom's job and is tracked as MN-433.
      - name: Miri — arena
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: >-
          cargo +nightly miri nextest run -p mnemosyne-arena --locked
          --profile miri -E 'not binary(/concurrency/)'

      # mnemosyne-memory-core rejoins the job now that MN-437 is fixed: the
      # reclamation seam addresses the page through its segment, so no page
      # borrow is live across a segment access.
      #
      # Both borrow models run, and that is not belt-and-braces. The first
      # attempt at the MN-437 fix passed Stacked Borrows while Tree Borrows
      # still rejected it, so a single-model gate would have certified a
      # still-broken fix.
      - name: Miri — core (Stacked Borrows)
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: >-
          cargo +nightly miri nextest run -p mnemosyne-memory-core --locked
          --profile miri

      - name: Miri — core (Tree Borrows)
        env:
          MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-tree-borrows
        run: >-
          cargo +nightly miri nextest run -p mnemosyne-memory-core --locked
          --profile miri

      # mnemosyne-local joins now that MN-440, MN-442, MN-443 and MN-445 are
      # fixed. It is the crate the aliasing defects actually lived in: the
      # re-entrancy gate read through the aliasing it existed to reject, the
      # huge classifier that read user payload as page metadata, and the
      # wildcard occupancy writes. It also earned its place immediately — the
      # per-CPU cache's weak compare-exchange in a bounded retry loop was live
      # on aarch64 and invisible to the native suite, because x86 lowers weak
      # and strong alike.
      #
      # Both models, and affordably: 36s Stacked, 172s Tree Borrows, nothing
      # crossing the 300s slow mark. Those were 388s and "three tests over the
      # 600s budget" before MN-445 fixed the offending tests at their causes.
      #
      # The last straggler was
      # `smallest_class_page_saturates_without_duplicate_or_early_refill`. It
      # looked irreducible — saturating a 16-byte-class page is 4096
      # allocations and that count is the property — but timing it in isolation
      # showed 66s, not the 300s+ the suite reported. Two things were true:
      # nextest runs one Miri interpreter per core (24 here), so a test's
      # reported wall clock includes contention with 23 others, and half of
      # this test's own cost was a teardown loop that asserted nothing. Deleting
      # the teardown took it to 36s and the whole Tree Borrows suite from 463s
      # to 172s, since it was the long pole.
      #
      # If a slow marker appears here again, time the test alone first: under
      # this much parallelism the suite's number is work plus contention, and
      # only the isolated number tells you which one grew.
      #
      # Leak checking is on, as in every other Miri step here. An earlier version
      # of this job disabled it, on the assumption that nearly every test in the
      # crate ends with segments retained in a pool. Measuring it showed 6 of 75
      # did (MN-444). Those six now drain the pools through a `PoolDrain` guard,
      # and the one test that deliberately poisons a free list repairs it after
      # asserting, so its segment can be reclaimed like any other test's.
      # The serialized TEST_LOCK guard drains empty reusable and orphan
      # mappings after each test-owned allocator has been dropped. It preserves
      # orphan segments with live blocks, so a real allocator leak remains a
      # failing Miri leak report.
      - name: Miri — local (Stacked Borrows)
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: >-
          cargo +nightly miri nextest run -p mnemosyne-local --locked
          --profile miri

      - name: Miri — local (Tree Borrows)
        env:
          MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-tree-borrows
        run: >-
          cargo +nightly miri nextest run -p mnemosyne-local --locked
          --profile miri

      # decay and backend join under MN-436, which records this job's
      # exclusions so none is silent and shrinks them as crates come clean.
      # Measured rather than assumed: heap, prof, c-shim and the top-level
      # crate still report Undefined Behavior from pointers reconstructed out
      # of exposed provenance, and stay out until that is migrated; hardened
      # has no tests.
      #
      # backend was reverted once (MN-454): it passed Miri on a Windows
      # development host and failed here, because that host compiles the
      # Windows backend while `backends/unix.rs` gated the `SEGMENT_SIZE`
      # import on `not(miri)` with tests using it unconditionally. Verified
      # this time by cross-compiling the tests for
      # x86_64-unknown-linux-gnu under `--cfg miri`, which reproduces that
      # build without needing a Linux host.
      - name: Miri — decay and backend (Stacked Borrows)
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: >-
          cargo +nightly miri nextest run -p mnemosyne-decay -p mnemosyne-backend
          --locked --profile miri

      - name: Miri — decay and backend (Tree Borrows)
        env:
          MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-tree-borrows
        run: >-
          cargo +nightly miri nextest run -p mnemosyne-decay -p mnemosyne-backend
          --locked --profile miri

  test-aarch64:
    name: Native tests (aarch64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    # Everything else here runs on x86-64, whose hardware memory model is
    # strong enough to hide a missing Acquire or Release: a load that should
    # have been Acquire usually behaves like one anyway. aarch64 does not do
    # that, so this job is what turns "the orderings read correctly" into
    # evidence. MN-434's audit of the allocator's Treiber loops and
    # cross-thread free queue was a code review on an x86 host; the tests that
    # exercise those paths only run against a weak memory model here.
    #
    # It also covers what a second platform covers generally: the cfg(unix)
    # madvise and hugepage-hint paths on a different page-size regime, and the
    # SEGMENT_ALIGN arithmetic against a kernel that need not use 4 KiB pages.
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: nextest@0.9.140

      - name: Run native tests
        run: cargo nextest run --locked --workspace

  # The benchmark crate is first-class verification surface, not dead weight:
  # three Criterion targets and their shared harness modules are linted with
  # the workspace floor and compiled+executed once here so a broken bench
  # cannot hide behind `--exclude`. `cargo test --benches` runs each Criterion
  # binary in its test mode (one cheap pass per group, no measurement), which
  # is the single-iteration smoke; the measured runs stay local by design.
  # Timeout derives from the five-minute job target plus the jemalloc
  # source build tikv-jemallocator performs on Linux.
  benchmark-hygiene:
    name: Benchmark hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0

      - name: Install cargo-nextest
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: nextest@0.9.140

      - name: Lint benchmarks with the workspace floor
        run: cargo clippy --locked -p mnemosyne-benchmarks --all-targets -- -D warnings

      - name: Single-pass Criterion smoke (test mode, no measurement)
        run: cargo test --locked --benches -p mnemosyne-benchmarks

  test-tsan:
    name: ThreadSanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Loom proves the interleavings it models and Miri checks aliasing, but
    # neither watches real threads race on real hardware. TSan does, and it
    # sees the paths a model does not reach: the segment pools, the orphan
    # hand-off, the cross-thread free queue under genuine concurrency.
    #
    # Includes the `mnemosyne` crate, whose integration tests install the
    # allocator process-wide with `#[global_allocator]`. That is the
    # configuration consumers actually run, and the one place the allocator's
    # own concurrency meets the sanitizer's bookkeeping — TSan allocates its
    # shadow state through the same libc surface the shim replaces.
    #
    # `-Zbuild-std` is not optional here: TSan reports races against
    # uninstrumented code as false positives, and std is uninstrumented
    # unless it is rebuilt.
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the nightly sanitizer toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: nightly
          components: rust-src

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Run the concurrency-bearing crates under TSan
        env:
          RUSTFLAGS: -Zsanitizer=thread
          RUSTDOCFLAGS: -Zsanitizer=thread
          # Halt on the first report rather than continuing under a known-bad
          # interleaving, and keep the second stack so a race names both sides.
          TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1
        run: >-
          cargo +nightly test --locked
          -Zbuild-std --target x86_64-unknown-linux-gnu
          -p mnemosyne-memory-core -p mnemosyne-arena -p mnemosyne-local
          -p mnemosyne-memory
