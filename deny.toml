[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "MIT",
    "Unicode-3.0",
    "Zlib",
    "BSD-3-Clause",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A workspace-only test dependency that closes a cycle stays path-only, so the
# registry archive omits it: a versioned one makes `cargo package` wait on a
# version that cannot exist before its own dependent. Path wildcards remain
# denied on normal and build dependencies of a published crate.
allow-wildcard-paths = true

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/ryancinsight/eunomia",
    "https://github.com/ryancinsight/themis",
    "https://github.com/ryancinsight/melinoe.git",
]
