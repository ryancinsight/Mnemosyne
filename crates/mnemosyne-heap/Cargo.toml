[package]
name = "mnemosyne-heap"
license = "MIT OR Apache-2.0"
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
repository.workspace = true
description = "Global allocator and placement backends for Mnemosyne"
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = []

[dependencies]
# Brand machinery (invariant-lifetime marker + thread-confined capability token)
# is sourced from melinoe, the ecosystem's branding crate. The workspace pins
# the sibling path and its published version together so local development and
# package metadata resolve the same provider. `default-features = false` keeps
# this `#![no_std]` crate free of std/alloc.
melinoe = { workspace = true }
mnemosyne-core = { package = "mnemosyne-memory-core", path = "../mnemosyne-core", version = "0.2.0" }
mnemosyne-backend = { path = "../mnemosyne-backend", version = "0.5.0" }
mnemosyne-arena = { path = "../mnemosyne-arena", version = "0.4.0" }
mnemosyne-local = { path = "../mnemosyne-local", version = "0.4.0" }
mnemosyne-prof = { path = "../mnemosyne-prof", version = "0.2.0" }
# Phase 3 Stage D1 device-memory integration: themis owns PlacementHint +
# MemoryTier (atlas ADR 0002). Used here as the typed placement vocabulary
# and the host-allocatable / budget-only classification
# (MemoryTier::is_host_allocatable). The workspace pins the sibling path and
# its published version together so the heap uses one law provider locally and
# when packaged. `default-features = false, features = ["std"]`
# matches `mnemosyne-local`/`mnemosyne-arena` so a single themis build is
# shared by all three.
themis = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Node-binding and interleave execution (`mbind`/`SYS_mbind`). Kept
# linux-gated so non-Linux builds carry no syscall surface; the crate stays
# `#![no_std]` (libc is FFI declarations only).
libc = { version = "0.2", default-features = false }

[dev-dependencies]
mnemosyne = { package = "mnemosyne-memory", path = "../mnemosyne" }

[lints]
workspace = true
