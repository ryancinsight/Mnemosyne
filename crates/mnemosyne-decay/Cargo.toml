[package]
name = "mnemosyne-decay"
license = "MIT OR Apache-2.0"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
repository.workspace = true
description = "Decay and reclamation policies for Mnemosyne arenas"

[features]
default = []

[dependencies]
mnemosyne-core = { package = "mnemosyne-memory-core", path = "../mnemosyne-core", version = "0.2.0" }
mnemosyne-backend = { path = "../mnemosyne-backend", version = "0.5.0" }
mnemosyne-arena = { path = "../mnemosyne-arena", version = "0.4.0" }

[dev-dependencies]
mnemosyne-local = { path = "../mnemosyne-local" }
