[package]
name = "mnemosyne-memory"
license = "MIT OR Apache-2.0"
version = "0.7.0"
edition = "2024"
rust-version.workspace = true
repository.workspace = true
description = "Concurrent user-space memory allocator facade"
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lib]
name = "mnemosyne"

[dependencies]
mnemosyne-local = { path = "../mnemosyne-local", version = "0.4.0" }
mnemosyne-heap = { path = "../mnemosyne-heap", version = "0.4.0", optional = true }
mnemosyne-arena = { path = "../mnemosyne-arena", version = "0.4.0" }
mnemosyne-backend = { path = "../mnemosyne-backend", version = "0.5.0" }
mnemosyne-core = { package = "mnemosyne-memory-core", path = "../mnemosyne-core", version = "0.2.0" }
mnemosyne-decay = { path = "../mnemosyne-decay", version = "0.3.0" }
mnemosyne-prof = { path = "../mnemosyne-prof", version = "0.2.0" }
eunomia = { workspace = true, optional = true }

[features]
default = ["mnemosyne-memory", "std_tls"]
mnemosyne-memory = ["branded"]
branded = ["dep:mnemosyne-heap"]
nightly_tls = ["mnemosyne-local/nightly_tls", "mnemosyne-prof/nightly_tls"]
std_tls = ["mnemosyne-local/std_tls", "mnemosyne-prof/std_tls"]
eunomia = ["dep:eunomia", "mnemosyne-arena/eunomia"]
segment-tail-guards = ["mnemosyne-arena/segment-tail-guards"]
segment-header-guards = ["mnemosyne-arena/segment-header-guards"]

[lints]
workspace = true
