[package]
name = "mnemosyne-benchmarks"
license = "MIT OR Apache-2.0"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
build = "build.rs"
publish = false

[features]
default = ["mnemosyne-memory"]
mnemosyne-memory = ["mnemosyne/branded"]
# Enables the hosted yield branch in the source-included arena lock benchmark.
std = []
# Opt-in jemalloc comparator on Windows by linking a system-installed
# `libjemalloc_s.a` (e.g. MSYS2 `mingw-w64-*-jemalloc`). `tikv-jemallocator`
# builds jemalloc from source, which does not link on windows-gnu, so the
# Windows jemalloc column is gated behind this feature and the system lib.
# `build.rs` locates the lib (via PATH `*/{ucrt64,mingw64}/bin` siblings or
# `MNEMOSYNE_JEMALLOC_LIB_DIR`) and emits the `jemalloc_available` cfg. On
# non-Windows targets jemalloc is always available through `tikv-jemallocator`.
system-jemalloc = []
nightly_tls = ["mnemosyne/nightly_tls"]

[dependencies]
mimalloc = { version = "0.1", features = ["extended"] }
rpmalloc = "0.2.2"
snmalloc-rs = { version = "0.3", features = ["win8compat"] }
criterion = { version = "0.5", features = ["html_reports"] }
serde_json = "1"
mnemosyne = { package = "mnemosyne-memory", path = "../mnemosyne", version = "0.7.0", default-features = false }
mnemosyne-arena = { path = "../mnemosyne-arena", version = "0.4.0" }
mnemosyne-backend = { path = "../mnemosyne-backend", version = "0.5.0" }
mnemosyne-core = { package = "mnemosyne-memory-core", path = "../mnemosyne-core", version = "0.2.0" }
mnemosyne-local = { path = "../mnemosyne-local", version = "0.4.0" }
mnemosyne-heap = { path = "../mnemosyne-heap", version = "0.4.0" }
mnemosyne-decay = { path = "../mnemosyne-decay", version = "0.3.0" }
mnemosyne-prof = { path = "../mnemosyne-prof", version = "0.2.0" }

[target.'cfg(not(windows))'.dependencies]
tikv-jemallocator = "0.6"

[build-dependencies]
mnemosyne-build-util = { path = "../mnemosyne-build-util", version = "0.2.0" }

[[bench]]
name = "allocator_bench"
harness = false

[[bench]]
name = "segment_lock"
harness = false

[[bench]]
name = "tls_bench"
harness = false
