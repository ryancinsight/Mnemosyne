[package]
name = "mnemosyne-prof"
license = "MIT OR Apache-2.0"
version = "0.2.1"
edition = "2024"
rust-version.workspace = true
repository.workspace = true
description = "Allocation profiling support for Mnemosyne"
homepage.workspace = true
readme = "README.md"
keywords = ["allocator", "profiling", "heap", "leak-detection", "memory"]
categories = ["memory-management", "development-tools::profiling"]

[dependencies]
backtrace = "0.3"
# Raw OS-TLS slot access (key init, get/set, Windows x86-64 TEB fast path) is
# shared with `mnemosyne-local`'s TLS providers through the one module in
# `mnemosyne_core::os_tls`, so this crate no longer re-declares the FFI.
mnemosyne-core = { package = "mnemosyne-memory-core", path = "../mnemosyne-core", version = "0.3.0" }

[build-dependencies]
mnemosyne-build-util = { path = "../mnemosyne-build-util", version = "0.2.1" }

[features]
nightly_tls = []
std_tls = []

[dev-dependencies]
mnemosyne = { package = "mnemosyne-memory", path = "../mnemosyne" }
mnemosyne-local = { path = "../mnemosyne-local" }
mnemosyne-heap = { path = "../mnemosyne-heap" }
mnemosyne-backend = { version = "0.6.0", path = "../mnemosyne-backend" }

[lints]
workspace = true
