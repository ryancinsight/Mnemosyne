[package]
name = "mnemosyne-arena"
license = "MIT OR Apache-2.0"
version = "0.4.0"
edition = "2024"
rust-version.workspace = true
repository.workspace = true
description = "Segment arenas and pools for the Mnemosyne allocator"
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = ["std"]
segment-tail-guards = []
segment-header-guards = []
eunomia = ["dep:eunomia"]
std = ["mnemosyne-core/std"]
## Blanket `ScratchElement` impl for any `bytemuck::Zeroable + Copy + Send + Sync + 'static` type.
## Enables `AlignedVec` and `ScratchPool` for arbitrary POD structs whose zero-representation
## is declared valid by their `Zeroable` impl (the same invariant `ScratchElement` encodes).
bytemuck = ["dep:bytemuck"]

[dependencies]
mnemosyne-core = { package = "mnemosyne-memory-core", path = "../mnemosyne-core", version = "0.2.0" }
mnemosyne-backend = { path = "../mnemosyne-backend", version = "0.5.0" }
eunomia = { workspace = true, optional = true }
bytemuck = { version = "1.0", optional = true, features = ["derive"] }
themis = { workspace = true }

[lints]
workspace = true

# Loom is pulled in only under `cfg(loom)`, which is set exclusively by the
# dedicated model runs (`RUSTFLAGS="--cfg loom"`). A cargo feature would be
# additive and could unify instrumented atomics into an ordinary build; a cfg
# cannot.
[target.'cfg(loom)'.dependencies]
loom = "0.7"
